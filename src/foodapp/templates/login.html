{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Sign in</h1>
  <form method="post" action="/login" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="254" value="{{ email }}" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password">
    </div>
    <button type="submit">Sign in</button>
  </form>
  <p class="aside">New here? <a href="/register?next={{ next_url|quote }}">Create an account</a></p>
</section>
{% endblock %}
