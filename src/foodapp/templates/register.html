{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Create an account</h1>
  <p>Use this to call your order at the counter. Passwords need 12 to 128 characters.</p>
  <form method="post" action="/register" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" required maxlength="60" value="{{ name }}" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="254" value="{{ email }}" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="password_confirm">Confirm password</label>
      <input id="password_confirm" name="password_confirm" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
    </div>
    <button type="submit">Create account</button>
  </form>
  <p class="aside">Already registered? <a href="/login?next={{ next_url|quote }}">Sign in</a></p>
</section>
{% endblock %}
